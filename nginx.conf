server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never include :3000 in redirect Location headers (Traefik handles the port)
    port_in_redirect off;
    absolute_redirect off;

    # Compression gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Security headers (transmitted by Traefik to HTTPS clients)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache long pour les assets versionnés (Astro génère des hashes)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache court pour les images
    location /pictures/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Pages HTML — serve index.html directly to avoid redirect loops with :3000
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # Page 404 custom (Astro génère 404.html si dispo)
    error_page 404 /404.html;
}
